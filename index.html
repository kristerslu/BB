                "form-title": "Unikāla Glezna", "form-desc": "Vēlaties darbu, kas ideāli iederas jūsu interjerā? Atstājiet savus datus nesaistošam pieprasījumam.", "form-btn": "Nosūtīt Pieprasījumu",
                "modal-sub": "Vai jūs interesē šis darbs? Atstājiet savus datus zemāk.",
                "modal-sold": "Šis darbs ir pārdots. Vēlaties kaut ko līdzīgā noskaņā? Atstājiet savus datus, un es labprāt radīšu darbu pēc pasūtījuma.",
                "sold": "Pārdots",
                "email-intro": "Vai rakstiet tieši e-pastā:",
                "p-name": "Vārds", "p-email": "E-pasts", "p-phone": "Tālrunis (neobligāti)", "p-msg": "Ziņojums", "p-msg-l": "Izmērs, krāsu palete u.c.",
                "art0": "Gaismas Sākums", "art1": "Zelta Kaskāde", "art2": "Zeltīta Pastaiga", "art3": "Zelta Pēdas", "art4": "Dobums", "art5": "Starp Stumbriem", "art6": "Kas Paliek", "art7": "Lapu Zelts", "art8": "Zelts 8", "art9": "Zelts 9", "art10": "Zelts 10", "art11": "Zelts 11", "art12": "Zelts 12", "art13": "Zelts 13", "art14": "Zelts 14",
                "success": "Ziņojums nosūtīts!", "error": "Ak vai! Kaut kas nogāja greizi."
            }
        };

        const languages = ['nl', 'fr', 'en', 'lv'];

        const artworks = [
            { id: "art0", price: "€ 200", size: "70x140 cm", images: ["public/Paintings/1.jpg", "public/Paintings/2.jpg", "public/Paintings/3.jpg", "public/Paintings/4.jpg", "public/Paintings/5.jpg"] },
            { id: "art1", price: "€ 100", size: "60x80 cm", images: ["public/Paintings/6.jpg", "public/Paintings/7.jpg", "public/Paintings/8.jpg", "public/Paintings/9.jpg"] },
            { id: "art2", price: "€ 35", size: "30x30 cm", images: ["public/Paintings/10.jpg", "public/Paintings/11.jpg", "public/Paintings/12.jpg", "public/Paintings/14.jpg", "public/Paintings/15.jpg"] },
            { id: "art3", price: "€ 75", size: "50x50 cm", images: ["public/Paintings/16.jpg", "public/Paintings/17.jpg", "public/Paintings/18.jpg", "public/Paintings/19.jpg"] },
            { id: "art4", price: "€ 55", size: "30x40 cm", images: ["public/Paintings/20.jpg", "public/Paintings/21.jpg", "public/Paintings/22.jpg", "public/Paintings/23.jpg", "public/Paintings/24.jpg", "public/Paintings/25.jpg", "public/Paintings/26.jpg"] },
            { id: "art5", price: "€ 35", size: "20x20 cm", sold: true, images: ["public/Paintings/27.jpg", "public/Paintings/28.jpg", "public/Paintings/29.jpg", "public/Paintings/30.jpg"] },
            { id: "art6", price: "€ 55", size: "30x30 cm", sold: true, images: ["public/Paintings/31.jpg", "public/Paintings/32.jpg", "public/Paintings/33.jpg", "public/Paintings/34.jpg", "public/Paintings/35.jpg", "public/Paintings/36.jpg", "public/Paintings/37.jpg"] },
            { id: "art7", price: "€ 60", size: "40x40 cm", images: ["public/Paintings/38.jpg", "public/Paintings/39.jpg", "public/Paintings/40.jpg", "public/Paintings/41.jpg"] },
            { id: "art8", price: "€ 75", size: "40x40 cm", images: ["public/Paintings/42.JPEG", "public/Paintings/43.JPEG", "public/Paintings/44.JPEG"] },
            { id: "art9", price: "€ 75", size: "40x40 cm", images: ["public/Paintings/45.JPEG", "public/Paintings/46.JPEG", "public/Paintings/47.JPEG"] },
            { id: "art10", price: "€ 75", size: "40x40 cm", images: ["public/Paintings/48.JPEG"] },
            { id: "art11", price: "€ 75", size: "40x40 cm", images: ["public/Paintings/49.JPEG", "public/Paintings/50.JPEG", "public/Paintings/51.JPEG", "public/Paintings/52.JPEG"] },
            { id: "art12", price: "€ 75", size: "40x40 cm", images: ["public/Paintings/53.JPEG", "public/Paintings/54.JPEG", "public/Paintings/55.JPEG", "public/Paintings/56.JPEG"] },
            { id: "art13", price: "€ 75", size: "40x40 cm", images: ["public/Paintings/57.JPEG", "public/Paintings/58.JPEG", "public/Paintings/59.JPEG"] },
            { id: "art14", price: "€ 75", size: "40x40 cm", images: ["public/Paintings/60.JPEG", "public/Paintings/61.JPEG", "public/Paintings/62.JPEG"] }
        ];

        let activeLang = 'nl';

        function setLang(lang) {
            activeLang = lang;
            document.querySelectorAll('[data-key]').forEach(el => { 
                const key = el.getAttribute('data-key');
                if (translations[lang] && translations[lang][key]) {
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = translations[lang][key];
                    else el.innerHTML = translations[lang][key];
                }
            });
            languages.forEach(x => document.getElementById('lng-'+x).classList.toggle('on', x === lang));

            updateImageAltTags();
        }

        function toggleNav(e){ e.stopPropagation(); document.getElementById('navMenu').classList.toggle('open'); document.getElementById('menuToggle').classList.toggle('open'); }
        function closeNav(){ document.getElementById('navMenu').classList.remove('open'); document.getElementById('menuToggle').classList.remove('open'); }
        window.addEventListener('click', () => closeNav());

        function updateImageAltTags() {
            artworks.forEach(art => {
                const title = translations[activeLang][art.id];
                const track = document.getElementById(`t-${artworks.indexOf(art)}`);
                if (track) {
                    const imgs = track.querySelectorAll('img');
                    imgs.forEach((img, i) => {
                        img.alt = `${title} - Abstract gold painting by Beta Beatrise Turnhout Belgium - View ${i + 1}`;
                    });
                }
            });
        }

        const root = document.getElementById('gallery-root');
        artworks.forEach((art, idx) => {
            root.insertAdjacentHTML('beforeend', `
                <div class="artwork-page${art.sold ? ' is-sold-work' : ''}" id="page-${idx}" data-idx="${idx}">
                    <div class="artwork-container reveal">
                        <div class="carousel-wrapper">
                            <button class="gallery-arrow" onclick="event.stopPropagation(); move(${idx}, -1)" aria-label="Previous image">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 18l-6-6 6-6"/></svg>
                            </button>
                            <div class="carousel" id="carousel-${idx}" onclick="handleCarouselClick(event, ${idx}, '${art.id}')">
                                <div class="carousel-track" id="t-${idx}" data-current="0">
                                    ${art.images.map((img, i) => `<img src="${img}" alt="">`).join('')}
                                </div>
                            </div>
                            <button class="gallery-arrow" onclick="event.stopPropagation(); move(${idx}, 1)" aria-label="Next image">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 18l6-6-6-6"/></svg>
                            </button>
                        </div>
                        <div style="margin-top: 1.5rem;">
                            <h3 class="serif art-title-btn" onclick="openModal('${art.id}')" data-key="${art.id}">${translations['nl'][art.id]}</h3>
                            <span class="price-tag${art.sold ? ' is-sold' : ''}">${art.price}</span>
                            ${art.sold ? `<span class="sold-tag" data-key="sold">${translations['nl']['sold']}</span>` : ''}
                            <span class="size-tag">${art.size}</span>
                        </div>
                    </div>
                </div>`);
        });

        // SWIPE LOGIC
        let touchStart = { x: 0, y: 0 };
        let isSwiping = false;

        document.querySelectorAll('.carousel').forEach((carousel, idx) => {
            carousel.addEventListener('touchstart', e => {
                touchStart.x = e.touches[0].clientX;
                touchStart.y = e.touches[0].clientY;
                isSwiping = false;
            }, {passive: false});

            carousel.addEventListener('touchmove', e => {
                if (!touchStart.x || !touchStart.y) return;
                let dx = touchStart.x - e.touches[0].clientX;
                let dy = touchStart.y - e.touches[0].clientY;
                if (Math.abs(dx) > Math.abs(dy) && e.cancelable) { e.preventDefault(); }
                if (Math.abs(dx) > 40 && !isSwiping && Math.abs(dx) > Math.abs(dy)) {
                    isSwiping = true;
                    move(idx, dx > 0 ? 1 : -1);
                }
            }, {passive: false});

            carousel.addEventListener('touchend', () => { touchStart.x = 0; touchStart.y = 0; isSwiping = false; }, {passive: true});
            carousel.addEventListener('touchcancel', () => { touchStart.x = 0; touchStart.y = 0; isSwiping = false; }, {passive: true});
        });

        function handleCarouselClick(event, idx, id) {
            const rect = event.currentTarget.getBoundingClientRect();
            const x = event.clientX - rect.left;
            if (x < rect.width * 0.3) move(idx, -1);
            else if (x > rect.width * 0.7) move(idx, 1);
            else openModal(id);
        }

        function move(idx, dir) {
            const track = document.getElementById(`t-${idx}`);
            const totalImages = track.querySelectorAll('img').length;
            let current = parseInt(track.getAttribute('data-current') || '0');
            current = (current + dir + totalImages) % totalImages;
            track.setAttribute('data-current', current);
            track.style.transform = `translateX(-${current * 100}%)`;
        }

        function resetGallery(idx) {
            const track = document.getElementById(`t-${idx}`);
            if (!track) return;
            if(track.getAttribute('data-current') !== '0') {
                track.style.transition = 'none';
                track.setAttribute('data-current', '0');
                track.style.transform = `translateX(0%)`;
                setTimeout(() => { track.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)'; }, 50);
            }
        }

        function openModal(artId) {
            const currentLang = activeLang;
            const art = artworks.find(a => a.id === artId);
            const isSold = !!(art && art.sold);

            document.getElementById('modalTitle').innerText = translations[currentLang][artId];
            document.getElementById('modalSold').style.display = isSold ? "block" : "none";
            document.getElementById('hiddenSubject').value = (isSold ? "Sold work - similar request: " : "Interest: ") + translations[currentLang][artId];
            document.getElementById('artModal').style.display = "block";
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal() { document.getElementById('artModal').style.display = "none"; document.body.style.overflow = 'auto'; }
        
        async function handleSubmit(event, statusId) {
            event.preventDefault();
            const form = event.target;
            const status = document.getElementById(statusId);
            const btn = form.querySelector('button');
            const currentLang = activeLang;
            btn.innerText = "Sending..."; 
            fetch(form.action, { method: 'POST', body: new FormData(form), headers: { 'Accept': 'application/json' } }).then(response => {
                if (response.ok) {
                    status.innerHTML = translations[currentLang]['success'];
                    status.style.display = "block"; form.reset(); btn.innerText = translations[currentLang]['form-btn'];
                    setTimeout(() => { status.style.display = "none"; if(statusId === 'modalStatus') closeModal(); }, 3000);
                }
            });
        }

        document.getElementById('mainForm').addEventListener('submit', (e) => handleSubmit(e, 'mainStatus'));
        document.getElementById('modalForm').addEventListener('submit', (e) => handleSubmit(e, 'modalStatus'));

        // RE-TRIGGER ANIMATIONS
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => { 
                if (entry.isIntersecting) { entry.target.classList.add('active'); } 
                else { entry.target.classList.remove('active'); }
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

        // RESET ON EXIT
        const resetObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.intersectionRatio < 0.1) {
                    const idx = entry.target.getAttribute('data-idx');
                    if (idx !== null) resetGallery(idx);
                }
            });
        }, { threshold: [0, 0.1, 0.9, 1] }); 
        document.querySelectorAll('.artwork-page').forEach(el => resetObserver.observe(el));

        setLang('nl');
    </script>
</body>
